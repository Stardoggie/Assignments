[project]
name = "ticket-assistant"
version = "0.1.0"
description = "A support-ticket assistant built on Amazon Bedrock's Converse API."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "langchain-core>=1.6",
    "langchain-aws>=1.7",
    "langgraph>=1.2",
    "langchain-text-splitters"
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ticket_assistant*"]
